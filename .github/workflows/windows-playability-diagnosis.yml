name: Windows playability bounded diagnosis
on:
  push:
    branches: [codex/windows-playability-diagnosis]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows-flows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SIGHTBREAK_BUILDS_DIR: ${{ github.workspace }}/builds/windows-playability-diagnosis
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Existing native Windows screenshot and OCR dependencies
        shell: pwsh
        run: |
          python -m pip install Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install tesseract --version=5.5.0.20241111 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = 'C:/Program Files/Tesseract-OCR/tesseract.exe'
          if (!(Test-Path $ocr)) { throw 'Tesseract executable missing' }
          "TESSERACT_BIN=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $ocr --version
      - name: Install checksum-pinned native Windows toolchain only
        run: python scripts/toolchain.py setup --targets windows
      - name: Real native observation filesystem regression
        run: python scripts/test_native_observation.py -v
      - name: Packaging provenance regression
        run: python scripts/test_build_manifest.py -v
      - name: Export this clean source revision
        id: export
        run: python scripts/export.py windows
      - name: Native graphical startup
        if: always() && steps.export.outcome == 'success'
        run: python scripts/verify_builds.py --targets windows --graphical
      - name: Offline input, settings, normal exit and restart
        if: always() && steps.export.outcome == 'success'
        run: python scripts/verify_offline_export.py --target windows --timeout 300 --output builds/windows-playability-diagnosis/offline-input
      - name: Upload offline input evidence immediately
        if: always() && steps.export.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-offline-input-${{ github.sha }}
          path: |
            builds/windows-playability-diagnosis/offline-input/**/*.json
            builds/windows-playability-diagnosis/offline-input/**/*.jsonl
            builds/windows-playability-diagnosis/offline-input/**/*.log
            builds/windows-playability-diagnosis/offline-input/**/*.png
            builds/windows-playability-diagnosis/windows/source.json
          if-no-files-found: error
          retention-days: 14
      - name: Real player plant and natural objective resolution
        if: always() && steps.export.outcome == 'success'
        run: python scripts/verify_offline_match.py --target windows --scenario plant --timeout 180 --output builds/windows-playability-diagnosis/offline-plant
      - name: Upload plant evidence immediately
        if: always() && steps.export.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-offline-plant-${{ github.sha }}
          path: |
            builds/windows-playability-diagnosis/offline-plant/**/*.json
            builds/windows-playability-diagnosis/offline-plant/**/*.jsonl
            builds/windows-playability-diagnosis/offline-plant/**/*.log
            builds/windows-playability-diagnosis/offline-plant/**/*.png
            builds/windows-playability-diagnosis/windows/source.json
          if-no-files-found: error
          retention-days: 14
      - name: Real player defuse after ordinary bot plant
        if: always() && steps.export.outcome == 'success'
        run: python scripts/verify_offline_match.py --target windows --scenario defuse --timeout 180 --output builds/windows-playability-diagnosis/offline-defuse
      - name: Upload defuse evidence immediately
        if: always() && steps.export.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-offline-defuse-${{ github.sha }}
          path: |
            builds/windows-playability-diagnosis/offline-defuse/**/*.json
            builds/windows-playability-diagnosis/offline-defuse/**/*.jsonl
            builds/windows-playability-diagnosis/offline-defuse/**/*.log
            builds/windows-playability-diagnosis/offline-defuse/**/*.png
            builds/windows-playability-diagnosis/windows/source.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve startup, source and export diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-startup-diagnosis-${{ github.sha }}
          path: |
            builds/windows-playability-diagnosis/windows/*.json
            builds/windows-playability-diagnosis/windows/*.log
            builds/windows-playability-diagnosis/verification/*.json
            builds/windows-playability-diagnosis/verification/*.log
            builds/windows-playability-diagnosis/verification/*.png
          if-no-files-found: warn
          retention-days: 14
