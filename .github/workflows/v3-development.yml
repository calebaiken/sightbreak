name: V3 frozen development validation
# Isolated continuation only. Never publishes a release or changes main.
on:
  push:
    branches: [integration/sightbreak-v3-validation]
permissions:
  contents: read
jobs:
  full-matrix-and-network:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0 # Protocol fixtures archive actual prior published commits.
      - name: Prepare pinned native engine and isolated backend
        id: setup
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libvulkan1 xvfb xauth ripgrep unzip
          scripts/setup.sh --editor-only
          python3 -m pip install uv==0.12.23
          UV_PROJECT_ENVIRONMENT="$PWD/.venv" uv sync --project backend --locked --group dev --python 3.12
          backend/dev-db.sh
          scripts/godot.sh --headless --editor --import --quit
          python3 -c "import sys; sys.path.insert(0, 'scripts'); from build_manifest import source, require_clean; require_clean(source())"
      - name: Full maintained matrix; retain every failure
        if: steps.setup.outcome == 'success'
        run: xvfb-run -a .venv/bin/python scripts/validate_matrix.py --backend --protocol --render --out builds/v3-matrix
      - name: Separate twelve-condition ten-client campaign
        if: always() && steps.setup.outcome == 'success'
        run: .venv/bin/python scripts/run_network_campaign.py --clients 10 --seconds 18 --port 39000 --out builds/v3-network
      - name: Retain raw validation evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sightbreak-v3-validation-${{ github.sha }}
          path: |
            builds/v3-matrix/
            builds/v3-network/
            .local/validation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  native-development-packages:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Prepare exact-source build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libvulkan1 xvfb xauth libxtst6 ripgrep unzip openjdk-17-jdk tesseract-ocr
          scripts/setup.sh
          scripts/setup-android.sh
          python3 -m pip install uv==0.12.23
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python Pillow==12.0.0
      - name: Export frozen commit (development only)
        id: exports
        run: |
          scripts/export.sh linux
          scripts/export.sh android
          scripts/export.sh ios
      - name: Inspect and package actual exports
        id: package
        run: |
          python3 scripts/verify_builds.py
          python3 scripts/build_manifest.py package > builds/packaging.json
          (cd builds && sha256sum --check checksums.txt)
          python3 scripts/verify_packaged_builds.py --output builds/v3-package-verification
      - name: Drive actual exported network client
        if: always() && steps.package.outcome == 'success'
        run: .venv/bin/python scripts/verify_integration_export.py --display :106 --visit-armory --reload-mode keyboard --timeout 240 --output builds/v3-export-network
      - name: Drive actual exported living-player offline client
        if: always() && steps.package.outcome == 'success'
        run: .venv/bin/python scripts/verify_offline_export.py --display :107 --timeout 300 --output builds/v3-export-offline
      - name: Retain development artifacts and all attempted-flow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sightbreak-v3-development-${{ github.sha }}
          path: |
            builds/sightbreak-*.zip
            builds/android/sightbreak-debug.apk
            builds/manifest.json
            builds/checksums.txt
            builds/packaging.json
            builds/verification/
            builds/v3-package-verification/
            builds/*/*.log
            builds/*/source.json
            builds/v3-export-network/
            builds/v3-export-offline/
          if-no-files-found: error
          retention-days: 14
  adversarial-audio-controls:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Declare isolated control paths at runtime
        run: |
          printf '%s\n' "SIGHTBREAK_TOOLS_DIR=$RUNNER_TEMP/sightbreak-control-tools" "SIGHTBREAK_STATE_DIR=$RUNNER_TEMP/sightbreak-control-state" "SIGHTBREAK_CONTROL_PYTHON=$RUNNER_TEMP/sightbreak-control-python/bin/python" >> "$GITHUB_ENV"
      - name: Prepare a separate exact-commit mutation checkout
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libvulkan1 xvfb xauth unzip
          python3 -m pip install uv==0.12.23
          uv venv "$RUNNER_TEMP/sightbreak-control-python" --python 3.13.15
          scripts/setup.sh --editor-only
          git worktree add --detach "$RUNNER_TEMP/sightbreak-v3-controls" "$GITHUB_SHA"
          mkdir -p builds/v3-audio-controls
      - name: Import and record the untouched baseline first
        working-directory: ${{ runner.temp }}/sightbreak-v3-controls
        run: |
          scripts/godot.sh --headless --editor --import --quit > "$GITHUB_WORKSPACE/builds/v3-audio-controls/import.log" 2>&1
          "$SIGHTBREAK_CONTROL_PYTHON" -c "import json, pathlib, sys; sys.path.insert(0, 'scripts'); from build_manifest import source, require_clean; receipt=source(); require_clean(receipt); pathlib.Path('$GITHUB_WORKSPACE/builds/v3-audio-controls/source-before.json').write_text(json.dumps(receipt, indent=2))"
      - name: Require the broad baseline then catch A5 A6 A7 without changing thresholds
        working-directory: ${{ runner.temp }}/sightbreak-v3-controls
        run: xvfb-run -a "$SIGHTBREAK_CONTROL_PYTHON" scripts/reload_negative_controls.py --only A5,A6,A7 --log "$GITHUB_WORKSPACE/builds/v3-audio-controls/summary.txt" --raw-out "$GITHUB_WORKSPACE/builds/v3-audio-controls/raw"
      - name: Audit source restoration without discarding any evidence
        if: always()
        working-directory: ${{ runner.temp }}/sightbreak-v3-controls
        run: |
          "$SIGHTBREAK_CONTROL_PYTHON" -c "import json, pathlib, sys; sys.path.insert(0, 'scripts'); from build_manifest import source, require_clean; receipt=source(); pathlib.Path('$GITHUB_WORKSPACE/builds/v3-audio-controls/source-after.json').write_text(json.dumps(receipt, indent=2)); require_clean(receipt); before=json.loads(pathlib.Path('$GITHUB_WORKSPACE/builds/v3-audio-controls/source-before.json').read_text()); sys.exit(0 if before == receipt else 1)"
      - name: Retain baseline failures mutant raw logs and audio captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sightbreak-v3-audio-controls-${{ github.sha }}
          path: builds/v3-audio-controls/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
