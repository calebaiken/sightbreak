name: Windows hosted priority playability validation
on:
  push:
    branches: [codex/windows-priority-playability-validation]
  workflow_dispatch:
    inputs:
      run_gameplay:
        type: boolean
        default: false
        description: Explicitly rerun the three offline gates (ownership-only by default)
permissions:
  contents: read
jobs:
  native-windows-flows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SIGHTBREAK_BUILDS_DIR: ${{ github.workspace }}/builds/windows-hosted-priority-probe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Existing native Windows screenshot and OCR dependencies
        shell: pwsh
        run: |
          python -m pip install Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install tesseract --version=5.5.0.20241111 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = 'C:/Program Files/Tesseract-OCR/tesseract.exe'
          if (!(Test-Path $ocr)) { throw 'Tesseract executable missing' }
          "TESSERACT_BIN=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $ocr --version
      - name: Install checksum-pinned native Windows toolchain only
        run: python scripts/toolchain.py setup --targets windows
      - name: Real native observation filesystem regression
        run: python scripts/test_native_observation.py -v
      - name: Packaging provenance regression
        run: python scripts/test_build_manifest.py -v
      - name: Export this clean source revision
        id: export
        run: python scripts/export.py windows
      - name: Native graphical startup
        if: always() && steps.export.outcome == 'success'
        run: python scripts/verify_builds.py --targets windows --graphical
      - name: Real owned PID and HWND priority boundaries
        if: always() && steps.export.outcome == 'success'
        shell: python
        run: |
          import ctypes as C
          from ctypes import wintypes as W
          import json, os, platform, subprocess, sys, time
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from build_manifest import BUILDS, OUTPUTS, source
          from verify_integration_export import WinUI
          out = BUILDS / 'priority-ownership'
          out.mkdir(parents=True)
          result = {'passed': False, 'host': platform.platform(), 'source': source(), 'controls': [],
                    'scope': 'Native helper ownership only; no offline gameplay acceptance or timing/rule changes'}
          children, handles = [], []
          user = C.WinDLL('user32', use_last_error=True)
          kernel = C.WinDLL('kernel32', use_last_error=True)
          user.PostMessageW.argtypes = [W.HWND, W.UINT, W.WPARAM, W.LPARAM]
          kernel.OpenProcess.argtypes = [W.DWORD, W.BOOL, W.DWORD]
          kernel.OpenProcess.restype = W.HANDLE
          kernel.GetPriorityClass.argtypes = [W.HANDLE]
          kernel.GetPriorityClass.restype = W.DWORD
          kernel.CloseHandle.argtypes = [W.HANDLE]
          kernel.CloseHandle.restype = W.BOOL
          def priority(pid):
              handle = kernel.OpenProcess(0x1000, False, pid)
              if not handle:
                  raise C.WinError(C.get_last_error())
              try:
                  value = kernel.GetPriorityClass(handle)
                  if not value:
                      raise C.WinError(C.get_last_error())
                  return value
              finally:
                  kernel.CloseHandle(handle)
          def launch(name, command, env=None):
              log = (out / (name + '.log')).open('w', encoding='utf-8')
              handles.append(log)
              child = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, env=env)
              children.append(child)
              return child
          def wait(predicate, seconds, label):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  value = predicate()
                  if value:
                      return value
                  time.sleep(.1)
              raise TimeoutError(label)
          try:
              # A second real GUI child is intentionally foreign to the selected
              # game Popen. It renders only a built-in Win32 STATIC window.
              foreign_script = out / 'foreign_gui.py'
              foreign_script.write_text("""import ctypes as C, json, sys, time
          from ctypes import wintypes as W
          from pathlib import Path
          u=C.WinDLL('user32',use_last_error=True)
          u.CreateWindowExW.argtypes=[W.DWORD,W.LPCWSTR,W.LPCWSTR,W.DWORD,C.c_int,C.c_int,C.c_int,C.c_int,W.HWND,W.HMENU,W.HINSTANCE,C.c_void_p]
          u.CreateWindowExW.restype=W.HWND
          u.IsWindow.argtypes=[W.HWND]
          u.PeekMessageW.argtypes=[C.POINTER(W.MSG),W.HWND,W.UINT,W.UINT,W.UINT]
          u.TranslateMessage.argtypes=[C.POINTER(W.MSG)]
          u.DispatchMessageW.argtypes=[C.POINTER(W.MSG)]
          u.DispatchMessageW.restype=W.LPARAM
          hwnd=u.CreateWindowExW(0,'STATIC','Owned foreign-window negative control',0x10cf0000,700,20,260,110,None,None,None,None)
          if not hwnd: raise C.WinError(C.get_last_error())
          Path(sys.argv[1]).write_text(json.dumps({'hwnd':hwnd}),encoding='utf-8')
          deadline=time.monotonic()+180
          msg=W.MSG()
          while u.IsWindow(hwnd):
              if time.monotonic()>deadline: raise TimeoutError('Foreign control window close deadline')
              while u.PeekMessageW(C.byref(msg),None,0,0,1):
                  u.TranslateMessage(C.byref(msg));u.DispatchMessageW(C.byref(msg))
              time.sleep(.01)
          """, encoding='utf-8')
              foreign_path = out / 'foreign-window.json'
              foreign = launch('foreign-gui', [sys.executable, str(foreign_script), str(foreign_path)])
              foreign_window = wait(lambda: json.loads(foreign_path.read_text())['hwnd'] if foreign_path.exists() else None, 10, 'Foreign GUI startup')
              env = dict(os.environ)
              for name in ('APPDATA', 'LOCALAPPDATA'):
                  directory = out / name.lower()
                  directory.mkdir()
                  env[name] = str(directory)
              game = launch('game', [str(BUILDS / OUTPUTS['windows']), '--audio-driver', 'Dummy', '--position', '0,0', '--resolution', '640x360'], env)
              ui = WinUI(game.pid)
              wait(ui.focus_game, 60, 'Actual exported game window startup')
              game_window = ui.window
              def snapshot():
                  return {'game': priority(game.pid), 'foreign': priority(foreign.pid), 'controller': priority(os.getpid())}
              def rejects(label, selected_process):
                  before = snapshot()
                  try:
                      ui.lower_owned_render_priority(selected_process)
                  except RuntimeError as error:
                      after = snapshot()
                      assert before == after, (label, before, after)
                      result['controls'].append({'name': label, 'passed': True, 'error': str(error), 'before': before, 'after': after})
                  else:
                      raise AssertionError(label + ': accepted a foreign ownership relationship')
              ui.window = foreign_window
              rejects('real foreign HWND with selected game PID', game)
              ui.window = game_window
              rejects('real foreign Popen with selected game HWND and PID', foreign)
              before = snapshot()
              receipt = ui.lower_owned_render_priority(game)
              after = snapshot()
              assert receipt['pid'] == receipt['window_pid'] == game.pid
              assert after['game'] == 0x4000 and receipt['current_priority_class'] == 0x4000
              assert before['foreign'] == after['foreign'] and before['controller'] == after['controller']
              result['controls'].append({'name': 'only matching real owned game is changed', 'passed': True, 'before': before, 'after': after, 'receipt': receipt})
              wait(lambda: ui.focus_game() and ui.menu_visible(), 60, 'Actual rendered main menu before normal close')
              ui.capture(out / 'native-owned-game.png')
              ui.request_close()
              assert game.wait(timeout=15) == 0
              before = {'foreign': priority(foreign.pid), 'controller': priority(os.getpid())}
              try:
                  ui.lower_owned_render_priority(game)
              except RuntimeError as error:
                  after = {'foreign': priority(foreign.pid), 'controller': priority(os.getpid())}
                  assert before == after
                  result['controls'].append({'name': 'exited real Popen and stale HWND rejected', 'passed': True, 'error': str(error), 'before': before, 'after': after})
              else:
                  raise AssertionError('Exited child accepted')
              if not user.PostMessageW(foreign_window, 0x10, 0, 0):
                  raise C.WinError(C.get_last_error())
              assert foreign.wait(timeout=10) == 0
              result['normal_exit_codes'] = {'game': game.returncode, 'foreign': foreign.returncode}
              result['passed'] = True
          except BaseException as error:
              result['error'] = type(error).__name__ + ': ' + str(error)
              raise
          finally:
              result['cleanup'] = []
              for child in children:
                  if child.poll() is None:
                      child.terminate()
                      try:
                          child.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          child.kill()
                          child.wait(timeout=5)
                      result['cleanup'].append({'pid': child.pid, 'forced_exit': child.returncode})
              for handle in handles:
                  handle.close()
              (out / 'results.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
              print(json.dumps(result, indent=2))
      - name: Upload native ownership boundaries immediately
        if: always() && steps.export.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-priority-ownership-${{ github.sha }}
          path: |
            builds/windows-hosted-priority-probe/priority-ownership/**
            builds/windows-hosted-priority-probe/windows/source.json
          if-no-files-found: error
          retention-days: 14
      - name: Offline input, settings, normal exit and restart
        if: always() && steps.export.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_gameplay
        run: python scripts/verify_offline_export.py --target windows --hosted-render-priority below-normal --timeout 300 --output builds/windows-hosted-priority-probe/offline-input
      - name: Upload offline input evidence immediately
        if: always() && steps.export.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_gameplay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-offline-input-${{ github.sha }}
          path: |
            builds/windows-hosted-priority-probe/offline-input/**/*.json
            builds/windows-hosted-priority-probe/offline-input/**/*.jsonl
            builds/windows-hosted-priority-probe/offline-input/**/*.log
            builds/windows-hosted-priority-probe/offline-input/**/*.png
            builds/windows-hosted-priority-probe/windows/source.json
          if-no-files-found: error
          retention-days: 14
      - name: Real player plant and natural objective resolution
        if: always() && steps.export.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_gameplay
        run: python scripts/verify_offline_match.py --target windows --hosted-render-priority below-normal --scenario plant --timeout 180 --output builds/windows-hosted-priority-probe/offline-plant
      - name: Upload plant evidence immediately
        if: always() && steps.export.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_gameplay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-offline-plant-${{ github.sha }}
          path: |
            builds/windows-hosted-priority-probe/offline-plant/**/*.json
            builds/windows-hosted-priority-probe/offline-plant/**/*.jsonl
            builds/windows-hosted-priority-probe/offline-plant/**/*.log
            builds/windows-hosted-priority-probe/offline-plant/**/*.png
            builds/windows-hosted-priority-probe/windows/source.json
          if-no-files-found: error
          retention-days: 14
      - name: Real player defuse after ordinary bot plant
        if: always() && steps.export.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_gameplay
        run: python scripts/verify_offline_match.py --target windows --hosted-render-priority below-normal --scenario defuse --timeout 180 --output builds/windows-hosted-priority-probe/offline-defuse
      - name: Upload defuse evidence immediately
        if: always() && steps.export.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_gameplay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-offline-defuse-${{ github.sha }}
          path: |
            builds/windows-hosted-priority-probe/offline-defuse/**/*.json
            builds/windows-hosted-priority-probe/offline-defuse/**/*.jsonl
            builds/windows-hosted-priority-probe/offline-defuse/**/*.log
            builds/windows-hosted-priority-probe/offline-defuse/**/*.png
            builds/windows-hosted-priority-probe/windows/source.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve startup, source and export diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-startup-diagnosis-${{ github.sha }}
          path: |
            builds/windows-hosted-priority-probe/windows/*.json
            builds/windows-hosted-priority-probe/windows/*.log
            builds/windows-hosted-priority-probe/verification/*.json
            builds/windows-hosted-priority-probe/verification/*.log
            builds/windows-hosted-priority-probe/verification/*.png
          if-no-files-found: warn
          retention-days: 14
