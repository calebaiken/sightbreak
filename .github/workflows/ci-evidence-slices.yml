name: Retained QA evidence slices
on:
  push:
    branches: [codex/qa-artifact-slices]
    paths: [scripts/slice_ci_evidence.py, .github/workflows/ci-evidence-slices.yml]
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed original run ID
        default: '39384250334'
      source_artifact:
        description: Original QA artifact ID or exact authorized historical Windows artifact
        default: '12245964199'
      source_commit:
        description: Exact original source SHA
        default: '0fb74800cffb96077069144028d113e308ef1744'
permissions:
  contents: read
  actions: read
jobs:
  slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_RUN: ${{ inputs.source_run || '39384250334' }}
      SOURCE_ARTIFACT: ${{ inputs.source_artifact || '12245964199' }}
      SOURCE_COMMIT: ${{ inputs.source_commit || '0fb74800cffb96077069144028d113e308ef1744' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download and preserve source-bound original observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/slice_ci_evidence.py
          --run-id "$SOURCE_RUN" --artifact-id "$SOURCE_ARTIFACT"
          --source-commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/evidence-slices"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.SOURCE_ARTIFACT != '12245964199'
        with:
          name: retained-qa-layouts-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence-slices/layouts
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.SOURCE_ARTIFACT != '12245964199'
        with:
          name: retained-qa-full-match-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence-slices/full-match
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.SOURCE_ARTIFACT != '12245964199'
        with:
          name: retained-qa-objectives-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence-slices/objectives
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.SOURCE_ARTIFACT != '12245964199'
        with:
          name: retained-qa-other-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence-slices/other
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.SOURCE_ARTIFACT == '12245964199'
        with:
          name: retained-historical-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence-slices/historical
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-qa-index-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence-slices/index
          if-no-files-found: warn
          retention-days: 14
