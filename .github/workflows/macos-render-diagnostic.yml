name: Intel macOS render attribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intel-render:
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      SIGHTBREAK_BUILDS_DIR: ${{ github.workspace }}/builds/macos-render-diagnostic
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install checksum-pinned Godot 4.7.2 and macOS templates
        run: python scripts/toolchain.py setup --targets macos
      - name: Validate diagnostic evidence controls
        run: python scripts/test_macos_render_diagnostic.py -v
      - name: Export exact clean shipping source
        id: export
        run: python scripts/export.py macos
      - name: Retain unchanged shipping startup qualification
        if: steps.export.outcome == 'success'
        run: python scripts/verify_builds.py --targets macos --graphical
      - name: Attribute render features despite a failed shipping startup gate
        if: always() && steps.export.outcome == 'success'
        run: python scripts/diagnose_macos_render.py --output builds/macos-render-diagnostic/render-features
      - name: Package bounded original QA evidence and checksums
        if: always()
        shell: python
        run: |
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['SIGHTBREAK_BUILDS_DIR'])
          root.mkdir(parents=True, exist_ok=True)
          files = []
          patterns = ('macos/source.json', 'macos/*.log', 'verification/*.json',
                      'verification/*.log', 'verification/*.png', 'render-features/*.json',
                      'render-features/*.log', 'render-features/*.txt', 'render-features/*.png')
          for pattern in patterns:
              files.extend(path for path in root.glob(pattern) if path.is_file())
          files = sorted(set(files))
          receipt = {'source_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                     'scope': 'Original diagnostic QA only; no release or gameplay acceptance',
                     'files': [{'path': path.relative_to(root).as_posix(), 'bytes': path.stat().st_size,
                                'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in files]}
          manifest = root / 'qa-manifest.json'
          manifest.write_text(json.dumps(receipt, indent=2) + '\n')
          archive = root / 'qa-evidence.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as bundle:
              for path in [*files, manifest]:
                  bundle.write(path, path.relative_to(root).as_posix())
          print(json.dumps({'archive': str(archive), 'bytes': archive.stat().st_size,
                            'sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
                            'original_files': len(files)}))
          if archive.stat().st_size >= 32 * 1024 * 1024:
              raise SystemExit('QA archive exceeds 32 MiB; preserve originals for a split upload')
      - name: Preserve separately downloadable original QA on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sightbreak-intel-render-qa-${{ github.sha }}
          path: |
            builds/macos-render-diagnostic/qa-evidence.zip
            builds/macos-render-diagnostic/qa-manifest.json
          if-no-files-found: warn
          retention-days: 14
