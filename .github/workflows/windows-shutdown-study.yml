name: Bounded Windows shutdown diagnosis (retention blocked)
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Full independently reviewed frozen source SHA; separate root release required
        required: true
        type: string
permissions:
  contents: read
jobs:
  study:
    if: github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      EXPECTED_STUDY_SOURCE: ${{ inputs.expected_source }}
      SIGHTBREAK_BUILDS_DIR: ${{ github.workspace }}/builds/shutdown-export
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pure controller controls
        run: python -m unittest discover -s scripts -p test_windows_shutdown_study.py -v
      - name: Source-bound complete retention preflight before any engine/export action
        id: retention
        shell: python
        run: |
          import os, subprocess, sys
          raise SystemExit(subprocess.call([sys.executable, 'scripts/windows_shutdown_study.py', 'preflight',
            '--expected-source', os.environ['EXPECTED_STUDY_SOURCE'], '--output', 'builds/shutdown-study/preflight.json']))
      - name: Windows OCR dependency (only after admitted complete retention)
        if: steps.retention.outcome == 'success'
        shell: pwsh
        run: |
          choco install tesseract --version=5.5.0.20241111 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocr = 'C:/Program Files/Tesseract-OCR/tesseract.exe'
          if (!(Test-Path $ocr)) { throw 'Tesseract executable missing' }
          "TESSERACT_BIN=$ocr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Screenshot dependency (only after admitted complete retention)
        if: steps.retention.outcome == 'success'
        run: python -m pip install Pillow==12.3.0
      - name: Pinned editor/templates (only after admitted complete retention)
        if: steps.retention.outcome == 'success'
        run: python scripts/toolchain.py setup --targets windows
      - name: One exact-source export (only after admitted complete retention)
        id: export
        if: steps.retention.outcome == 'success'
        shell: python
        run: |
          import pathlib, subprocess, sys
          out=pathlib.Path('builds/shutdown-study');out.mkdir(exist_ok=True)
          with (out/'export-stdout.log').open('wb') as stdout,(out/'export-stderr.log').open('wb') as stderr:
            result=subprocess.run([sys.executable,'scripts/export.py','windows'],stdout=stdout,stderr=stderr)
          raise SystemExit(result.returncode)
      - name: Four fixed living/focus/reopened-close attempts only
        if: steps.export.outcome == 'success'
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, sys
          shutil.copyfile(pathlib.Path(os.environ['SIGHTBREAK_BUILDS_DIR'])/'windows/source.json','builds/shutdown-study/export-source.json')
          raise SystemExit(subprocess.call([sys.executable,'scripts/windows_shutdown_study.py','collect',
            '--expected-source',os.environ['EXPECTED_STUDY_SOURCE'],'--output','builds/shutdown-study/trials']))
      - name: Preserve all complete and failed evidence within exactly two bounded archives
        if: always()
        shell: python
        run: |
          import os, subprocess, sys
          raise SystemExit(subprocess.call([sys.executable,'scripts/windows_shutdown_study.py','package',
            '--expected-source',os.environ['EXPECTED_STUDY_SOURCE'],'--source','builds/shutdown-study','--output','builds/shutdown-archives']))
      - name: Preserve bounded evidence archive one
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-shutdown-study-one-${{ github.sha }}
          path: builds/shutdown-archives/evidence-1.zip
          compression-level: 0
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve bounded evidence archive two
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-shutdown-study-two-${{ github.sha }}
          path: builds/shutdown-archives/evidence-2.zip
          compression-level: 0
          if-no-files-found: warn
          retention-days: 14
