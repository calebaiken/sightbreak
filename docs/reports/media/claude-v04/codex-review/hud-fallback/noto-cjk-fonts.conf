<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Reproduces Codex's CJK fallback (Noto Sans CJK) on a host whose own CJK face is
     WenQuanYi Zen Hei. Extract Debian/Ubuntu fonts-noto-cjk (1:20230817+repack1-3)
     with `dpkg-deb -x fonts-noto-cjk_*.deb <scratch>/notocjk/root`, replace <scratch>,
     and run Godot with FONTCONFIG_FILE=<this file>. Nothing is installed system-wide.
     The rejected faces would otherwise be chosen first for CJK text. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir><scratch>/notocjk/root/usr/share/fonts</dir>
  <cachedir><scratch>/notocjk/cache</cachedir>
  <selectfont><rejectfont><glob>/usr/share/fonts/truetype/wqy/*</glob><glob>/usr/share/fonts/opentype/ipafont-gothic/*</glob><glob>/usr/share/fonts/truetype/fonts-japanese-gothic.ttf</glob><glob>/usr/share/fonts/opentype/unifont/*</glob><glob>/usr/share/fonts/truetype/unifont/*</glob></rejectfont></selectfont>
</fontconfig>
